<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaMarkt · Panel de Operaciones</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23DF0000'/%3E%3Ctext x='50' y='66' font-family='Montserrat,Arial,sans-serif' font-size='38' font-weight='900' fill='white' text-anchor='middle' letter-spacing='-2'%3EMA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --mm-red:#DF0000; --mm-red-dark:#B00000; --mm-red-hover:#C40017;
  --mm-red-soft:#FFF0F0; --mm-red-soft-2:#FDE4E6;
  --mm-ink:#1A1A1A; --mm-ink-soft:#3A3A3A;
  --mm-gray:#6B6B6B; --mm-gray-light:#9A9A9A;
  --mm-line:#E6E8EC; --mm-bg:#F7F8FA;
  --radius:12px; --radius-lg:16px;
  --sidebar-w:260px; --sidebar-w-collapsed:76px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 4px 12px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12);
  --transition:.22s cubic-bezier(.4,0,.2,1);
  --success:#16A34A; --danger:#DC2626; --warning:#D97706;
  --mm-purple:#7C3AED;
  --mm-green:#1e7e34; --mm-green-bg:#e6f4ea;
  --mm-blue:#0066cc; --mm-blue-bg:#e6f0fa;
}

body{
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--mm-bg); color:var(--mm-ink); line-height:1.55;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
a{color:inherit}
button{font-family:inherit}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh;}

/* ============ SIDEBAR ============ */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;
  width:var(--sidebar-w);background:#fff;
  border-right:1px solid var(--mm-line);
  display:flex;flex-direction:column;z-index:200;
  transition:width var(--transition),transform var(--transition);
  overflow:hidden;
}
.sidebar__brand{
  display:flex;align-items:center;gap:12px;
  padding:20px 20px 18px;border-bottom:1px solid var(--mm-line);flex-shrink:0;
}
.sidebar__logo{
  width:38px;height:38px;border-radius:10px;background:var(--mm-red);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:16px;letter-spacing:-1px;flex-shrink:0;
  box-shadow:0 4px 12px rgba(223,0,0,.28);
}
.sidebar__title{display:flex;flex-direction:column;min-width:0;transition:opacity var(--transition);}
.sidebar__title strong{font-size:15px;font-weight:800;letter-spacing:-.3px;color:var(--mm-ink);white-space:nowrap;}
.sidebar__title span{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mm-gray-light);white-space:nowrap;}
.sidebar__nav{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.sidebar__label{
  font-size:10px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--mm-gray-light);
  padding:12px 12px 6px;white-space:nowrap;transition:opacity var(--transition);
}
.sidebar__link{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;
  color:var(--mm-ink-soft);cursor:pointer;text-decoration:none;
  transition:background var(--transition),color var(--transition);
  white-space:nowrap;position:relative;border:none;background:transparent;
  text-align:left;width:100%;
}
.sidebar__link:hover{background:#F2F3F5;color:var(--mm-ink)}
.sidebar__link.is-active{background:var(--mm-red-soft);color:var(--mm-red);font-weight:800;}
.sidebar__link.is-active::before{
  content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
  width:4px;height:22px;border-radius:0 3px 3px 0;background:var(--mm-red);
}
.sidebar__icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.sidebar__icon svg{width:18px;height:18px;fill:currentColor}
.sidebar__text{flex:1;overflow:hidden;text-overflow:ellipsis;transition:opacity var(--transition);}
.sidebar__badge{
  font-size:10px;font-weight:800;letter-spacing:.4px;
  padding:2px 7px;border-radius:999px;background:var(--mm-red);color:#fff;flex-shrink:0;
}
.sidebar__footer{
  padding:14px 16px;border-top:1px solid var(--mm-line);
  font-size:11px;font-weight:600;color:var(--mm-gray-light);
  white-space:nowrap;transition:opacity var(--transition);flex-shrink:0;
}
.sidebar__footer strong{color:var(--mm-ink);font-weight:800;display:block;font-size:11.5px}
.sidebar__collapse{
  position:absolute;top:74px;right:-13px;
  width:26px;height:26px;border-radius:50%;
  background:#fff;border:1px solid var(--mm-line);color:var(--mm-gray);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:var(--shadow-sm);
  transition:background var(--transition),color var(--transition);z-index:2;
}
.sidebar__collapse:hover{background:var(--mm-red);color:#fff;border-color:var(--mm-red)}
.sidebar__collapse svg{width:12px;height:12px;transition:transform var(--transition)}

.app.is-collapsed .sidebar{width:var(--sidebar-w-collapsed)}
.app.is-collapsed .sidebar__title,
.app.is-collapsed .sidebar__label,
.app.is-collapsed .sidebar__text,
.app.is-collapsed .sidebar__badge,
.app.is-collapsed .sidebar__footer{opacity:0;pointer-events:none;width:0;overflow:hidden}
.app.is-collapsed .sidebar__link{justify-content:center;padding:12px}
.app.is-collapsed .sidebar__link.is-active::before{left:-8px}
.app.is-collapsed .sidebar__collapse svg{transform:rotate(180deg)}
.app.is-collapsed .main{margin-left:var(--sidebar-w-collapsed)}

/* ============ MAIN ============ */
.main{
  flex:1;margin-left:var(--sidebar-w);min-height:100vh;
  display:flex;flex-direction:column;
  transition:margin-left var(--transition);min-width:0;
}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--mm-line);
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:14px 28px;min-height:66px;
}
.topbar__left{display:flex;align-items:center;gap:14px;min-width:0}
.topbar__hamburger{
  display:none;width:38px;height:38px;border-radius:10px;
  border:1px solid var(--mm-line);background:#fff;color:var(--mm-ink);
  align-items:center;justify-content:center;cursor:pointer;
  transition:background var(--transition),color var(--transition);
}
.topbar__hamburger:hover{background:var(--mm-red-soft);color:var(--mm-red);border-color:var(--mm-red)}
.topbar__title{font-size:16px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar__title span{color:var(--mm-red)}
.topbar__right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.topbar__date{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mm-gray);white-space:nowrap;}
.topbar__avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--mm-red),#8E0000);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;letter-spacing:-.3px;
  box-shadow:0 4px 12px rgba(223,0,0,.25);
}

/* ============ CONTENT ============ */
.content{flex:1;padding:28px;width:100%;}

/* ============ DASHBOARD ============ */
.dash{display:flex;flex-direction:column;gap:24px;max-width:1180px;margin-inline:auto;}
.dash__hero{
  background:linear-gradient(120deg,#1A1A1A 0%,#2E0B0B 100%);
  border-radius:var(--radius-lg);padding:34px 38px;color:#fff;
  position:relative;overflow:hidden;box-shadow:var(--shadow-lg);
}
.dash__hero::before{
  content:"";position:absolute;top:-80px;right:-60px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(223,0,0,.55) 0%,transparent 68%);pointer-events:none;
}
.dash__hero::after{
  content:"";position:absolute;bottom:-100px;left:20%;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0%,transparent 70%);pointer-events:none;
}
.dash__hero-inner{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:flex-end}
.dash__eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;
  color:#FF8A8A;margin-bottom:14px;
}
.dash__eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mm-red);box-shadow:0 0 0 4px rgba(223,0,0,.25);}
.dash__greeting{font-size:clamp(24px,3.2vw,34px);font-weight:800;letter-spacing:-1px;line-height:1.15;margin-bottom:10px;}
.dash__greeting .accent{color:#FF5252}
.dash__sub{font-size:14.5px;color:rgba(255,255,255,.72);font-weight:500;max-width:60ch;line-height:1.6;}
.dash__clock{display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:right;flex-shrink:0;}
.dash__clock-time{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-1.2px;line-height:1;font-variant-numeric:tabular-nums;color:#fff;}
.dash__clock-date{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.55);}

.dash__grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;}
.dash__panel{background:#fff;border:1px solid var(--mm-line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;}
.dash__panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 22px;border-bottom:1px solid var(--mm-line);
}
.dash__panel-head h2{
  font-size:14px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--mm-ink);
  display:flex;align-items:center;gap:9px;
}
.dash__panel-head h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--mm-red);}
.dash__panel-head span{font-size:11.5px;font-weight:700;color:var(--mm-gray-light);letter-spacing:.4px;text-transform:uppercase;}

.dash__list{list-style:none;padding:8px;}
.dash__item{
  display:flex;align-items:center;gap:16px;padding:14px;
  border-radius:10px;text-decoration:none;color:inherit;cursor:pointer;
  transition:background var(--transition);
  border:none;background:transparent;width:100%;text-align:left;
}
.dash__item:hover{background:#F7F8FA}
.dash__item:hover .dash__item-arrow{transform:translateX(4px);color:var(--mm-red)}
.dash__item-icon{
  width:42px;height:42px;border-radius:11px;
  background:var(--mm-red-soft);color:var(--mm-red);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background var(--transition),color var(--transition);
}
.dash__item-icon svg{width:20px;height:20px;fill:currentColor}
.dash__item:hover .dash__item-icon{background:var(--mm-red);color:#fff}
.dash__item-body{flex:1;min-width:0}
.dash__item-title{font-size:14px;font-weight:800;letter-spacing:-.2px;color:var(--mm-ink);margin-bottom:2px;display:block;}
.dash__item-desc{font-size:12px;color:var(--mm-gray);line-height:1.45;display:block;}
.dash__item-arrow{color:var(--mm-gray-light);flex-shrink:0;transition:transform var(--transition),color var(--transition);}

.dash__stats{display:grid;grid-template-columns:1fr;gap:14px;padding:18px 22px 22px;}
.dash__stat{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#F7F8FA;border-radius:10px;border-left:3px solid var(--mm-red);}
.dash__stat-icon{
  width:34px;height:34px;border-radius:9px;background:#fff;color:var(--mm-red);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow-sm);
}
.dash__stat-icon svg{width:17px;height:17px;fill:currentColor}
.dash__stat-body{flex:1;min-width:0}
.dash__stat-label{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mm-gray-light);margin-bottom:2px;}
.dash__stat-value{font-size:15px;font-weight:800;color:var(--mm-ink);letter-spacing:-.3px;}

/* ============ CARDS & FORMS ============ */
.card{
  background:#fff;padding:32px;border-radius:var(--radius-lg);
  border:1px solid var(--mm-line);box-shadow:var(--shadow-sm);
  margin-bottom:24px;max-width:1100px;margin-inline:auto;
}
.card h2{margin-bottom:20px;font-size:22px;font-weight:800;color:var(--mm-ink);letter-spacing:-.4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h3{margin:22px 0 12px;font-size:17px;font-weight:800;color:var(--mm-ink);letter-spacing:-.3px}
.breadcrumb{font-size:12px;font-weight:600;color:var(--mm-gray-light);margin-bottom:12px;}
.breadcrumb a{color:var(--mm-gray-light);text-decoration:none;transition:color var(--transition);}
.breadcrumb a:hover{color:var(--mm-red);}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border:none;border-radius:10px;
  cursor:pointer;font:inherit;font-size:13.5px;font-weight:700;
  text-decoration:none;margin:4px 8px 4px 0;
  transition:all .15s ease;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn-primary{background:var(--mm-red);color:#fff}
.btn-primary:hover{background:var(--mm-red-hover);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{color:#fff}
.btn-purple{background:var(--mm-purple);color:#fff}
.btn-purple:hover{color:#fff}
.btn-secondary{background:#F7F8FA;color:var(--mm-ink);border:1px solid var(--mm-line);}
.btn-secondary:hover{color:var(--mm-red);border-color:var(--mm-red);background:var(--mm-red-soft)}
.btn-ghost{background:transparent;color:var(--mm-gray);border:1px solid var(--mm-line);text-decoration:none;}
.btn-ghost:hover{color:var(--mm-red);border-color:var(--mm-red);background:var(--mm-red-soft)}

label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.6px;
  color:var(--mm-gray);margin:16px 0 6px;text-transform:uppercase;}
input,select,textarea{
  width:100%;padding:11px 15px;
  border:1px solid var(--mm-line);border-radius:10px;
  background:#fff;color:var(--mm-ink);font:inherit;font-size:13.5px;
  transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mm-red);box-shadow:0 0 0 4px rgba(223,0,0,.1);}
textarea{resize:vertical;min-height:170px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
textarea[readonly]{background:#F7F8FA;border-color:transparent}

.alert{padding:16px 20px;border-radius:10px;border-left:4px solid;margin:16px 0;font-size:13.5px;line-height:1.55;}
.alert h3{margin-top:0;font-size:15px;margin-bottom:8px;color:var(--mm-ink);}
.alert p{margin-bottom:6px}
.alert p:last-child{margin-bottom:0}
.alert ul, .alert ol{margin:8px 0 0 20px}
.alert ul li, .alert ol li{margin-bottom:4px}
.alert-info{background:var(--mm-red-soft);border-color:var(--mm-red)}
.alert-warning{background:#FFFBEB;border-color:#F59E0B}
.alert-success{background:#F0FDF4;border-color:var(--success)}
.alert-danger{background:#FEF2F2;border-color:var(--danger)}

.oracle{background:#F7F8FA;border-left:4px solid var(--mm-line);
  padding:16px 20px;border-radius:10px;margin:16px 0;font-size:13.5px;color:var(--mm-ink-soft);}
.oracle h3{margin-top:0;font-size:14px;color:var(--mm-ink);margin-bottom:8px;font-weight:800;}
.oracle p{margin:4px 0}

.info-table{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:13.5px;border:1px solid var(--mm-line);border-radius:10px;overflow:hidden;}
.info-table th{background:#1A1A1A;color:#fff;text-align:left;padding:12px 16px;font-weight:800;font-size:12px;letter-spacing:.5px;text-transform:uppercase;}
.info-table td{padding:12px 16px;border-top:1px solid var(--mm-line);color:var(--mm-ink-soft);vertical-align:top;}
.info-table tr:last-child td{border-bottom:none}
.info-table strong{color:var(--mm-ink)}

.steps-list{list-style:none;counter-reset:step;margin:16px 0;padding:0;}
.steps-list li{position:relative;padding:14px 16px 14px 52px;
  background:#F7F8FA;border-radius:10px;margin-bottom:8px;
  font-size:13.5px;color:var(--mm-ink-soft);line-height:1.55;}
.steps-list li::before{
  counter-increment:step;content:counter(step);
  position:absolute;left:16px;top:14px;
  width:24px;height:24px;background:var(--mm-red);color:#fff;
  border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:12px;
}
.steps-list li strong{color:var(--mm-ink)}

.check-list{list-style:none;margin:12px 0;padding:0}
.check-list li{position:relative;padding:6px 8px 6px 30px;font-size:13.5px;color:var(--mm-ink-soft);line-height:1.55;}
.check-list li::before{content:'✓';position:absolute;left:4px;top:6px;color:var(--success);font-weight:900;font-size:15px;}

/* ============ TARJETAS ============ */
.fin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px;}
.fin-card{
  display:flex;flex-direction:column;gap:10px;
  background:#fff;border:1px solid var(--mm-line);
  border-radius:var(--radius);padding:20px;
  text-decoration:none;color:var(--mm-ink);
  box-shadow:var(--shadow-sm);
  transition:all .2s ease;position:relative;overflow:hidden;
}
.fin-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--mm-red);transform:scaleX(0);transform-origin:left;
  transition:transform .25s ease;
}
.fin-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--mm-red-soft-2);}
.fin-card:hover::before{transform:scaleX(1);}
.fin-card-icon{font-size:28px;line-height:1;margin-bottom:4px;}
.fin-card-title{font-size:15px;font-weight:800;color:var(--mm-ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.fin-card-desc{font-size:12.5px;color:var(--mm-gray);line-height:1.5;}
.fin-card-arrow{margin-top:auto;align-self:flex-end;color:var(--mm-red);font-size:18px;font-weight:800;transition:transform .15s;}
.fin-card:hover .fin-card-arrow{transform:translateX(4px);}

.grid-motivos{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px;}
.estado-card{
  display:flex;flex-direction:column;gap:8px;
  background:#fff;border:1px solid var(--mm-line);
  border-left:4px solid var(--mm-red);
  border-radius:var(--radius);padding:16px;
  text-decoration:none;color:var(--mm-ink);
  transition:all .15s ease;box-shadow:var(--shadow-sm);
}
.estado-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--mm-red);}
.estado-card .titulo{font-size:14.5px;font-weight:800;color:var(--mm-ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.estado-card .meta{font-size:12.5px;color:var(--mm-gray);line-height:1.45}
.estado-card .meta strong{color:var(--mm-ink)}
.estado-card .meta.cancelar strong{color:var(--danger)}
.estado-card .accion{color:var(--mm-red);font-weight:800;align-self:flex-end;font-size:16px;margin-top:4px;}
.estado-card .badge-grupo{font-size:10px;padding:2px 6px}

.faq-search-wrap{position:relative;margin:16px 0;}
.faq-search-wrap input{padding-left:44px;font-size:14px;background:#F7F8FA;border-color:transparent;}
.faq-search-wrap input:focus{background:#fff;border-color:var(--mm-red);}
.faq-search-wrap::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;opacity:.5;}

.filtros-plazo{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.filtro-pill{
  padding:8px 16px;border-radius:999px;
  background:#F7F8FA;border:1px solid var(--mm-line);
  color:var(--mm-gray);font-size:12.5px;font-weight:700;
  cursor:pointer;text-decoration:none;transition:all .15s;
}
.filtro-pill:hover{border-color:var(--mm-red);color:var(--mm-red)}
.filtro-pill.active{background:var(--mm-red);color:#fff;border-color:var(--mm-red)}

.faq-item{border:1px solid var(--mm-line);border-radius:10px;margin-bottom:12px;overflow:hidden;background:#fff;}
.faq-item summary{padding:16px 22px;cursor:pointer;font-weight:700;font-size:14px;color:var(--mm-ink);list-style:none;position:relative;transition:background .15s;}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:'+';position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--mm-red);font-size:20px;font-weight:800;transition:transform .2s;}
.faq-item[open] summary::after{content:'−'}
.faq-item summary:hover{background:#F7F8FA}
.faq-item p,.faq-answer{padding:0 22px 18px;font-size:13.5px;color:var(--mm-ink-soft);line-height:1.65;}
.faq-answer p{margin-bottom:10px}
.faq-answer p:last-child{margin-bottom:0}
.faq-answer ol,.faq-answer ul{margin:10px 0 10px 20px}
.faq-answer li{margin-bottom:6px}
.faq-cats{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0;}
.faq-cat-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 14px;border-radius:999px;
  background:#F7F8FA;color:var(--mm-gray);
  border:1px solid var(--mm-line);font-size:12.5px;font-weight:700;
  cursor:pointer;text-decoration:none;transition:all .15s;
}
.faq-cat-pill:hover{border-color:var(--mm-red);color:var(--mm-red);background:var(--mm-red-soft);}
.faq-cat-pill.active{background:var(--mm-red);color:#fff;border-color:var(--mm-red);}
.faq-counter{font-size:12.5px;color:var(--mm-gray);margin-bottom:12px;}
.faq-counter b{color:var(--mm-red);font-weight:800;}

.badge{display:inline-block;padding:3px 10px;border-radius:999px;
  font-size:11px;font-weight:800;vertical-align:middle;letter-spacing:.2px;}
.badge-blue{background:var(--mm-blue-bg);color:var(--mm-blue)}
.badge-green{background:var(--mm-green-bg);color:var(--mm-green)}
.badge-red{background:var(--mm-red);color:#fff}
.badge-purple{background:#EDE9FE;color:#5B21B6}
.badge-gray{background:#F7F8FA;color:var(--mm-gray);border:1px solid var(--mm-line)}

.toast{position:fixed;bottom:32px;right:32px;padding:15px 22px;border-radius:10px;
  background:var(--mm-ink);color:#fff;font-size:13.5px;font-weight:700;
  box-shadow:0 10px 25px rgba(0,0,0,.2);animation:slideIn .3s cubic-bezier(.175,.885,.32,1.275);z-index:1000;}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}}

.overlay{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);backdrop-filter:blur(2px);z-index:150;opacity:0;transition:opacity var(--transition);}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseFechaLocal(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatearFecha(date){
  return date.toLocaleDateString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric' });
}
async function copiarTexto(texto){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(texto); return true;
    }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch{ return false; }
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);

}

function calcularGarantia(fechaStr){
  const fechaCompra = parseFechaLocal(fechaStr);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dias = Math.floor((hoy - fechaCompra) / 86400000);
  if(dias <= 60){ return { estado:'devolucion', dias, restantes: 60 - dias }; }
  const anios = fechaCompra >= new Date(2022, 0, 1) ? 3 : 2;
  const fin = new Date(fechaCompra);
  fin.setFullYear(fin.getFullYear() + anios);
  if(hoy > fin) return { estado:'fuera', anios, fechaFin: fin };
  return { estado:'vigente', anios, fechaFin: fin };
}

function renderOracle({ categoria, cola, estado, extras }){
  return `<div class="oracle"><h3>🖥️ Oracle</h3><p><strong>Categoría:</strong> ${esc(categoria)}</p><p><strong>Cola:</strong> ${esc(cola)}</p><p><strong>Estado:</strong> ${esc(estado)}</p>${extras ? extras.map(x => `<p><strong>${esc(x.k)}:</strong> ${esc(x.v)}</p>`).join('') : ''}</div>`;
}

function renderCampo(campo){
  const valor = state.datos[campo.id] ?? campo.default ?? '';
  const id = `campo-${campo.id}`;
  if(campo.tipo === 'select'){
    return `<label for="${id}">${esc(campo.label)}</label><select id="${id}" data-campo="${campo.id}">${campo.opciones.map(op => `<option value="${esc(op)}" ${op === valor ? 'selected' : ''}>${esc(op)}</option>`).join('')}</select>`;
  }
  if(campo.tipo === 'textarea'){
    return `<label for="${id}">${esc(campo.label)}</label><textarea id="${id}" data-campo="${campo.id}" placeholder="${esc(campo.placeholder || '')}">${esc(valor)}</textarea>`;
  }
  return `<label for="${id}">${esc(campo.label)}</label><input type="text" id="${id}" data-campo="${campo.id}" value="${esc(valor)}" placeholder="${esc(campo.placeholder || '')}">`;
}

function plantillaLayout({ breadcrumb, titulo, badge, info, oracle, campos, volverA }){

      <h2>${esc(titulo)} ${badge ? `<span class="badge ${badge.clase}">${esc(badge.texto)}</span>` : ''}</h2>

    </div>
  `;
}

function resolveRoute(route){
  if(routes[route]) return routes[route];
  const mEstGrupo = route.match(/^estado-pedido\/(avanzar|cancelar|incidencia|tienda)$/);
  if(mEstGrupo) return () => viewEstadoPedidoLista(mEstGrupo[1]);
  const mEstFicha = route.match(/^estado-pedido\/ficha\/([\w-]+)(?:\?modo=([a-z]+))?$/);
  if(mEstFicha && getEstadoPorSlug(mEstFicha[1])) {
    const modo = mEstFicha[2] || 'avanzar';
    return () => viewEstadoPedidoFicha(mEstFicha[1], modo);
  }
  const mRec = route.match(/^reclamacion\/(paqueteria|gran-carga)\/([\w-]+)$/);
  if(mRec) return () => viewReclamacionForm(mRec[2], mRec[1]);
  const mFaq = route.match(/^marketplace\/faqs\/([\w-]+)$/);
  if(mFaq && categoriasFaqsMarketplace[mFaq[1]]) return () => viewMarketplaceFaqs(mFaq[1]);
  const mMkt = route.match(/^marketplace\/gestion\/([\w-]+)$/);
  if(mMkt && tiposMarketplace[mMkt[1]]) return () => viewMarketplaceForm(mMkt[1]);
  return null;
}
function currentRoute(){ return location.hash.replace(/^#\/?/, ''); }

  if(btnCollapse){

      try { localStorage.setItem('mm-apoyo-sidebar-collapsed', app.classList.contains('is-collapsed') ? '1' : '0'); } catch(e){}

      app.classList.remove('is-mobile-open');

function render(){
  const route = currentRoute();
  const view = resolveRoute(route) || viewNotFound;
  document.getElementById('contenido').innerHTML = view();

  document.querySelectorAll('.sidebar__link[href^="#"]').forEach(el => {
    const target = el.getAttribute('href')?.replace(/^#\/?/, '') ?? '';
    const segmento = target.split('/')[0];
    const routeSeg = route.split('/')[0];
    el.classList.toggle('is-active', segmento === routeSeg && (route === '' || segmento !== ''));
    if(target === '' && route === '') el.classList.add('is-active');
  });

  const key = route.split('/')[0] || '';
  const titleEl = document.getElementById('topbarTitle');
  if(titleEl) titleEl.innerHTML = TITULOS[key] || 'Panel <span>de Operaciones</span>';

  updatePreview();
  gestionarReloj(route);
  startDashboardClock();
  actualizarRelojTopbar();
}

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function pad2(n){ return String(n).padStart(2,'0'); }

let dashClockInterval = null;
function startDashboardClock(){
  if(dashClockInterval) clearInterval(dashClockInterval);
  const timeEl = document.getElementById('dashClock');
  const dateEl = document.getElementById('dashDate');
  const greetEl = document.getElementById('dashGreeting');
  if(!timeEl || !dateEl) return;
  const update = () => {
    const now = new Date();
    timeEl.textContent = `${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}`;
    const dia = DIAS[now.getDay()];
    dateEl.textContent = `${dia.charAt(0).toUpperCase()+dia.slice(1)}, ${now.getDate()} de ${MESES[now.getMonth()]} de ${now.getFullYear()}`.toUpperCase();
    if(greetEl){
      const h = now.getHours();
      const saludo = h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
      greetEl.innerHTML = `${saludo}, <span class="accent">equipo</span>`;
    }
  };
  update();
  dashClockInterval = setInterval(update, 1000);
}

function actualizarRelojTopbar(){
  const el = document.getElementById('topbarDate');
  if(!el) return;
  const now = new Date();
  const dia = DIAS[now.getDay()];
  const diaCap = dia.charAt(0).toUpperCase() + dia.slice(1);
  el.textContent = `${diaCap}, ${pad2(now.getDate())}/${pad2(now.getMonth()+1)}`;
}

let clockInterval = null;
function gestionarReloj(route){
  if(clockInterval){ clearInterval(clockInterval); clockInterval = null; }
  if(route !== 'reclamacion/paqueteria' && route !== 'tipo/tv') return;
  const el = document.getElementById('horaEspana');
  if(!el) return;
  const actualizar = () => {
    const ahora = new Date();
    const madrid = new Date(ahora.toLocaleString('en-US', { timeZone:'Europe/Madrid' }));
    const hh = pad2(madrid.getHours()), mm = pad2(madrid.getMinutes()), ss = pad2(madrid.getSeconds());
    const dia = madrid.getDay();
    const esFinde = dia === 0 || dia === 6;
    const enHorario = madrid.getHours() >= 9 && madrid.getHours() < 18;
    const disponible = enHorario && !esFinde;
    el.className = `alert ${disponible ? 'alert-success' : 'alert-danger'}`;
    el.innerHTML = `<div style="font-size:22px;font-weight:800;margin-bottom:6px">${hh}:${mm}:${ss}</div><div>${disponible ? '🟢 Transferencia disponible' : '🔴 Fuera de horario de transferencia'}</div>`;
  };
  actualizar();
  clockInterval = setInterval(actualizar, 1000);
}

function filtrarFaqs(query){
  const q = String(query || '').toLowerCase().trim();
  const items = document.querySelectorAll('#faqList .faq-item');
  let visibles = 0;
  items.forEach(el => {
    const match = !q || el.textContent.toLowerCase().includes(q);
    el.style.display = match ? '' : 'none';
    if(match) visibles++;
  });
  const contador = document.getElementById('faqCount');
  if(contador) contador.textContent = visibles;
}
function buscarEstadoPedido(){
  const q = (document.getElementById('buscarEstado')?.value || '').toLowerCase().trim();
  const out = document.getElementById('resultadoBuscarEstado');
  if(!out) return;
  if(!q){ out.innerHTML = ''; return; }
  const matches = estadosPedido.filter(e => e.estado.toLowerCase().includes(q) || e.derivarA.toLowerCase().includes(q) || (e.cancelar || '').toLowerCase().includes(q));
  if(!matches.length){ out.innerHTML = '<div class="alert alert-warning">❌ No se encontraron estados con ese texto.</div>'; return; }
  out.innerHTML = matches.slice(0, 8).map(e => `
    <a class="estado-card" href="#/estado-pedido/ficha/${e.slug}?modo=avanzar" style="margin-bottom:8px">
      <div class="titulo"><span style="font-size:18px">${esc(e.icono)}</span><span>${esc(e.estado)}</span></div>
      <div class="meta">${esc(gruposEstadoPedido[e.grupo].label)} · ${esc(e.plazo)}</div>
    </a>
  `).join('');
}
function validarFecha(){
  const input = document.getElementById('fechaCompra');
  const aviso = document.getElementById('avisoFecha');
  if(!input.value){ aviso.textContent = '⚠️ Selecciona una fecha de compra para continuar.'; aviso.style.display = 'block'; input.focus(); return; }
  state.fechaCompra = input.value;
  state.garantia = calcularGarantia(input.value);
  switch(state.garantia.estado){
    case 'devolucion': location.hash = '#/devolucion'; break;
    case 'fuera':      location.hash = '#/fuera';      break;
    default:           location.hash = '#/validar-danio'; break;
  }
}
async function copiarPreview(){
  const preview = document.getElementById('preview');
  if(!preview) return;
  const ok = await copiarTexto(preview.value);
  toast(ok ? '✅ Copiado al portapapeles' : '❌ No se pudo copiar');
}
function nuevoCaso(){

}
function buscarSAT(){
  const texto = document.getElementById('marcaSAT')?.value.toLowerCase().trim();
  const resultado = document.getElementById('resultadoSAT');
  if(!resultado) return;
  if(!texto){ resultado.innerHTML = ''; return; }

      html += `<div class="alert alert-info"><h3>${marca.toUpperCase()}</h3><p><strong>Teléfono:</strong> ${datos.telefono}</p><p><strong>Horario:</strong> ${datos.horario}</p></div>`;
    }
  });
  resultado.innerHTML = html || '<div class="alert alert-warning">❌ No se encontraron resultados</div>';
}

  if(e.target.closest('[data-nuevo-caso]'))   { nuevoCaso(); return; }
  const filtro = e.target.closest('[data-filtro-plazo]');
  if(filtro){ e.preventDefault(); state.filtroPlazo = filtro.dataset.filtroPlazo; render(); return; }
  const link = e.target.closest('a[href^="#"]');
  if(!link) return;
  const href = link.getAttribute('href') || '#/';
  const currentHash = (location.hash.replace(/^#/, '') || '').replace(/^\/+/, '');
  const targetHash  = (href.replace(/^#/, '') || '').replace(/^\/+/, '');
  if(currentHash === targetHash && !link.dataset.filtroPlazo){
    e.preventDefault();
    render();
    document.querySelector('.content')?.scrollTo({ top:0, behavior:'smooth' });
  }
});

/* ==========================================
   INIT
   ========================================== */
(function init(){
  initSidebar();
  render();
})();
</script>
</body>
</html>
