<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaMarkt · Panel de Operaciones</title>

<!-- FAVICON SVG (Fondo rojo, letras MA blancas) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23E2001A'/><text x='50' y='50' font-family='Arial,sans-serif' font-weight='bold' font-size='50' fill='%23FFFFFF' text-anchor='middle' dominant-baseline='central'>MA</text></svg>">

<style>
:root{
  --mm-red:#E2001A; --mm-red-dark:#B8001A; --mm-red-hover:#C40017; 
  --mm-red-soft:#FEF2F2; --mm-red-soft-2:#FDE4E6;
  --mm-white:#FFFFFF; --mm-black:#1A1A1A;
  --mm-gray-900:#2B2B2B; --mm-gray-700:#4B5563; --mm-gray-500:#6B7280;
  --mm-gray-300:#D1D5DB; --mm-gray-100:#F3F4F6; --mm-gray-50:#F9FAFB;
  --mm-purple:#7C3AED;

  --mm-bg-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80');
  --mm-bg-opacity: 0.05;

  --bg:var(--mm-gray-100); --surface:var(--mm-white); --surface-2:var(--mm-gray-50);
  --border:#E5E7EB; --text:var(--mm-black); --text-muted:var(--mm-gray-700);
  --success:#16A34A; --danger:#DC2626; --warning:#D97706;
  
  --radius:16px; --radius-sm:10px;
  --shadow:0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -1px rgb(0 0 0 / 0.03);
  --shadow-lg:0 10px 25px -3px rgb(0 0 0 / 0.1), 0 4px 6px -2px rgb(0 0 0 / 0.05);
  
  --sidebar-w: 260px;
  --sidebar-collapsed-w: 80px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
}

/* ================= LAYOUT ================= */
.layout{display:flex; height:100vh; width:100vw; overflow:hidden}

/* ================= SIDEBAR ================= */
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  transition:width .3s cubic-bezier(0.4, 0, 0.2, 1);
  position:relative; z-index:20;
}
.sidebar.collapsed{ width:var(--sidebar-collapsed-w); }

.sidebar-header{
  height:72px; display:flex; align-items:center; padding:0 20px;
  border-bottom:1px solid var(--border);
  gap:12px; text-decoration:none; color:var(--mm-black);
  overflow:hidden; white-space:nowrap;
}
.sidebar-header svg{ flex-shrink:0; width:32px; height:32px; }
.sidebar-header .logo-text{
  display:flex; flex-direction:column; transition:opacity .2s;
}
.sidebar.collapsed .logo-text{ opacity:0; pointer-events:none; }
.sidebar-header .brand-name{ font-size:16px; font-weight:800; line-height:1.1; color:var(--mm-red); }
.sidebar-header .brand-sub{ font-size:10px; font-weight:600; color:var(--mm-gray-500); letter-spacing:1px; text-transform:uppercase; }

.sidebar nav{
  flex:1; padding:16px 12px; display:flex; flex-direction:column; gap:4px;
  overflow-y:auto; overflow-x:hidden;
}

.menu-item{
  display:flex; align-items:center; gap:12px;
  padding:12px 14px; border-radius:var(--radius-sm);
  color:var(--mm-gray-700); text-decoration:none;
  font-size:14px; font-weight:500; white-space:nowrap;
  transition:all .15s ease;
}
.menu-item:hover{
  background:var(--mm-red-soft); color:var(--mm-red);
}
.menu-item.active{
  background:var(--mm-red); color:var(--mm-white);
  font-weight:600; box-shadow:0 4px 12px rgba(226,0,26,.25);
}
.menu-item svg{
  flex-shrink:0; width:20px; height:20px; fill:currentColor;
}
.menu-item span{
  transition:opacity .2s;
}
.sidebar.collapsed .menu-item span{ opacity:0; pointer-events:none; }
.sidebar.collapsed .menu-item{ justify-content:center; padding:12px 0; }

.sidebar-footer{
  padding:16px; border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
}
.btn-collapse{
  background:var(--mm-gray-50); border:1px solid var(--border);
  color:var(--mm-gray-500); border-radius:8px;
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .15s;
}
.btn-collapse:hover{ background:var(--mm-red-soft); color:var(--mm-red); border-color:var(--mm-red-soft-2); }

/* ================= MAIN CONTENT ================= */
.main-wrapper{
  flex:1; display:flex; flex-direction:column;
  overflow:hidden; position:relative;
}
.main{
  flex:1; padding:32px 40px; overflow-y:auto;
  position:relative; z-index:1;
}
.main::before{
  content:''; position:absolute; inset:0;
  background-image:var(--mm-bg-image);
  background-size:cover; background-position:center;
  opacity:var(--mm-bg-opacity); pointer-events:none; z-index:-1;
}

/* ================= DASHBOARD HOME ================= */
.dashboard-header{ margin-bottom:32px; }
.dashboard-header h1{
  font-size:32px; font-weight:800; color:var(--mm-black); letter-spacing:-.5px; margin-bottom:8px;
}
.dashboard-header p{ font-size:16px; color:var(--text-muted); }
.dash-grid{
  display:grid; grid-template-columns:2fr 1fr; gap:24px; margin-bottom:32px;
}
@media (max-width: 1024px) { .dash-grid{ grid-template-columns:1fr; } }
.dash-card{
  background:var(--surface); border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:var(--shadow);
  padding:24px; display:flex; flex-direction:column;
}
.dash-card h3{
  font-size:18px; font-weight:700; color:var(--mm-black);
  margin-bottom:16px; display:flex; align-items:center; gap:8px;
}
.dash-list{ display:flex; flex-direction:column; gap:8px; }
.dash-item{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px; border-radius:var(--radius-sm);
  background:var(--mm-gray-50); border:1px solid transparent;
  text-decoration:none; color:var(--mm-black); transition:all .15s;
}
.dash-item:hover{
  background:var(--surface); border-color:var(--border);
  box-shadow:var(--shadow); transform:translateY(-2px);
}
.dash-item-left{ display:flex; align-items:center; gap:16px; }
.dash-item-icon{
  width:40px; height:40px; border-radius:10px;
  background:var(--mm-red-soft); color:var(--mm-red);
  display:flex; align-items:center; justify-content:center;
}
.dash-item-icon svg{ width:22px; height:22px; fill:currentColor; }
.dash-item-text strong{ display:block; font-size:15px; font-weight:600; }
.dash-item-text span{ font-size:13px; color:var(--text-muted); }
.dash-item-arrow{ color:var(--mm-red); font-weight:700; }

.clock-widget{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; height:100%; min-height:200px;
  background:linear-gradient(135deg, var(--mm-red) 0%, var(--mm-red-dark) 100%);
  color:var(--mm-white); border-radius:var(--radius);
  padding:32px; box-shadow:0 10px 25px rgba(226,0,26,.2);
}
.clock-time{ font-size:48px; font-weight:800; letter-spacing:-1px; line-height:1; margin-bottom:8px;}
.clock-date{ font-size:15px; font-weight:500; opacity:0.9; }
.clock-sep{ width:40px; height:3px; background:rgba(255,255,255,.3); margin:20px 0; border-radius:2px;}
.clock-user{ font-size:14px; font-weight:600; letter-spacing:1px; text-transform:uppercase; opacity:0.8;}

/* ================= CARDS & FORMS ================= */
.card{
  background:var(--surface);
  padding:32px; border-radius:var(--radius);
  border:1px solid var(--border); box-shadow:var(--shadow-lg);
  margin-bottom:32px;
}
.card h2{ margin-bottom:24px; font-size:24px; font-weight:800; color:var(--mm-black); letter-spacing:-.3px;}
.card h3{ margin:24px 0 12px; font-size:18px; font-weight:700; color:var(--mm-black)}
.breadcrumb{ font-size:13px; font-weight:500; color:var(--text-muted); margin-bottom:12px; }
.breadcrumb a{ color:var(--text-muted); text-decoration:none; transition:color .15s; }
.breadcrumb a:hover{ color:var(--mm-red); }

.btn{display:inline-flex; align-items:center; gap:8px;
  padding:10px 20px; border:none; border-radius:var(--radius-sm);
  cursor:pointer; font:inherit; font-size:14px; font-weight:600;
  text-decoration:none; margin:4px 8px 4px 0;
  transition:all .15s ease;}
.btn:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.1)}
.btn-primary{background:var(--mm-red); color:var(--mm-white)}
.btn-primary:hover{background:var(--mm-red-hover)}
.btn-success{background:var(--success); color:var(--mm-white)}
.btn-danger{background:var(--danger); color:var(--mm-white)}
.btn-purple{background:var(--mm-purple); color:var(--mm-white)}
.btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-ghost{background:transparent; color:var(--text-muted); border:1px solid var(--border); text-decoration:none;}
.btn-ghost:hover{color:var(--mm-red); border-color:var(--mm-red); background:var(--mm-red-soft)}

label{display:block; font-size:13px; font-weight:600;
  color:var(--text-muted); margin:16px 0 6px;}
input,select,textarea{width:100%; padding:12px 16px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--text); font:inherit; font-size:14px;
  transition:border-color .15s, box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--mm-red);
  box-shadow:0 0 0 4px rgba(226,0,26,.1);}
textarea{resize:vertical; min-height:180px; line-height:1.5}
textarea[readonly]{background:var(--surface-2); border-color:transparent;}

/* Alertas y cajas */
.alert{padding:16px 20px; border-radius:var(--radius-sm);
  border-left:4px solid; margin:16px 0; font-size:14px; line-height:1.5;}
.alert h3{margin-top:0; font-size:16px; margin-bottom:8px}
.alert-info{background:var(--mm-red-soft); border-color:var(--mm-red)}
.alert-warning{background:#FFFBEB; border-color:#F59E0B}
.alert-success{background:#F0FDF4; border-color:var(--success)}
.alert-danger{background:#FEF2F2; border-color:var(--danger)}

.oracle{background:var(--mm-gray-50); border-left:4px solid var(--mm-gray-300);
  padding:16px 20px; border-radius:var(--radius-sm);
  margin:16px 0; font-size:14px; color:var(--mm-gray-700);}
.oracle h3{margin-top:0; font-size:15px; color:var(--mm-gray-900); margin-bottom:8px;}
.oracle p{margin:4px 0}

/* Tablas */
.info-table{width:100%; border-collapse:collapse; margin:16px 0; font-size:14px;}
.info-table th{background:var(--mm-gray-50); color:var(--mm-gray-700); text-align:left;
  padding:14px 16px; font-weight:600; border-bottom:2px solid var(--border);}
.info-table td{padding:14px 16px; border-bottom:1px solid var(--border);
  color:var(--text-muted); vertical-align:top;}
.info-table tr:last-child td{border-bottom:none}
.info-table strong{color:var(--mm-black)}

/* Listas */
.steps-list{list-style:none; counter-reset:step; margin:16px 0; padding:0;}
.steps-list li{position:relative; padding:16px 16px 16px 56px;
  background:var(--mm-gray-50); border-radius:var(--radius-sm);
  margin-bottom:8px; font-size:14px; color:var(--text-muted); line-height:1.5;}
.steps-list li::before{
  counter-increment:step; content:counter(step);
  position:absolute; left:16px; top:16px;
  width:24px; height:24px;
  background:var(--mm-red); color:var(--mm-white);
  border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-weight:700; font-size:12px;
}
.steps-list li strong{color:var(--mm-black)}

.check-list{list-style:none; margin:12px 0; padding:0}
.check-list li{position:relative; padding:8px 8px 8px 32px;
  font-size:14px; color:var(--text-muted); line-height:1.5;}
.check-list li::before{content:'✓'; position:absolute; left:4px; top:8px;
  color:var(--success); font-weight:900; font-size:16px;}

/* ================= TARJETAS (FIX) ================= */
.fin-grid{ 
  display:grid; 
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); 
  gap:16px; 
  margin-top:20px; 
}
.fin-card {
  display: flex; 
  flex-direction: column; 
  gap: 10px;
  background: var(--surface); 
  border: 1px solid var(--border);
  border-radius: var(--radius-sm); 
  padding: 20px;
  text-decoration: none; 
  color: var(--text);
  box-shadow: 0 2px 4px rgba(0,0,0,.02);
  transition: all .2s ease;
  position: relative; 
  overflow: hidden;
}
.fin-card::before {
  content: ''; 
  position: absolute; 
  top: 0; left: 0; right: 0; 
  height: 4px;
  background: var(--mm-red); 
  transform: scaleX(0); 
  transform-origin: left;
  transition: transform .25s ease;
}
.fin-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 20px rgba(0,0,0,.08);
  border-color: var(--mm-red-soft-2);
}
.fin-card:hover::before { transform: scaleX(1); }
.fin-card-icon { font-size: 28px; line-height: 1; margin-bottom: 4px; }
.fin-card-title {
  font-size: 16px; 
  font-weight: 700; 
  color: var(--mm-black);
  display: flex; 
  align-items: center; 
  gap: 8px; 
  flex-wrap: wrap;
}
.fin-card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
.fin-card-arrow {
  margin-top: auto; 
  align-self: flex-end;
  color: var(--mm-red); 
  font-size: 18px; 
  font-weight: 700;
  transition: transform .15s;
}
.fin-card:hover .fin-card-arrow { transform: translateX(4px); }

/* ================= LISTAS DE ESTADO ================= */
.grid-motivos{ 
  display:grid; 
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:12px; 
  margin-top:16px;
}
.estado-card{
  display:flex; flex-direction:column; gap:8px;
  background:var(--surface); border:1px solid var(--border);
  border-left:4px solid var(--mm-red);
  border-radius:var(--radius-sm);
  padding:16px;
  text-decoration:none; color:var(--text);
  transition:all .15s ease;
}
.estado-card:hover{
  transform:translateY(-2px);
  box-shadow:var(--shadow);
  border-color:var(--mm-red);
}
.estado-card .titulo{font-size:15px; font-weight:700; color:var(--mm-black); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.estado-card .meta{font-size:13px; color:var(--text-muted); line-height:1.4}
.estado-card .meta strong{color:var(--mm-black)}
.estado-card .meta.cancelar strong{color:var(--danger)}
.estado-card .accion{color:var(--mm-red); font-weight:700; align-self:flex-end; font-size:16px; margin-top:4px;}
.estado-card .badge-grupo{font-size:10px; padding:2px 6px}

/* FAQ y Buscadores */
.faq-search-wrap{ position:relative; margin:16px 0; }
.faq-search-wrap input{ padding-left:48px; font-size:15px; background:var(--mm-gray-50); border-color:transparent;}
.faq-search-wrap input:focus{ background:var(--surface); border-color:var(--mm-red);}
.faq-search-wrap::before{ content:'🔍'; position:absolute; left:18px; top:50%;
  transform:translateY(-50%); font-size:16px; pointer-events:none; opacity:.5; }

.filtros-plazo{display:flex; gap:8px; flex-wrap:wrap; margin:16px 0}
.filtro-pill{
  padding:8px 16px; border-radius:20px;
  background:var(--mm-gray-50); border:1px solid var(--border);
  color:var(--text-muted); font-size:13px; font-weight:600;
  cursor:pointer; text-decoration:none;
  transition:all .15s;
}
.filtro-pill:hover{border-color:var(--mm-red); color:var(--mm-red)}
.filtro-pill.active{background:var(--mm-red); color:var(--mm-white); border-color:var(--mm-red)}

/* FAQ */
.faq-item{border:1px solid var(--border); border-radius:var(--radius-sm);
  margin-bottom:12px; overflow:hidden; background:var(--surface);}
.faq-item summary{padding:18px 24px; cursor:pointer; font-weight:600;
  font-size:15px; color:var(--mm-black); list-style:none;
  position:relative; transition:background .15s;}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:'+'; position:absolute; right:24px; top:50%;
  transform:translateY(-50%); color:var(--mm-red);
  font-size:20px; font-weight:700; transition:transform .2s;}
.faq-item[open] summary::after{content:'−'}
.faq-item summary:hover{background:var(--mm-gray-50)}
.faq-item p{padding:0 24px 20px 24px; font-size:14px; color:var(--text-muted);
  line-height:1.6;}
.faq-answer{padding:0 24px 20px 24px; font-size:14px; color:var(--text-muted);
  line-height:1.6;}
.faq-cats{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
.faq-cat-pill{
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 14px; border-radius:20px;
  background:var(--mm-gray-50); color:var(--text-muted);
  border:1px solid var(--border); font-size:13px; font-weight:600;
  cursor:pointer; text-decoration:none; transition:all .15s;
}
.faq-cat-pill:hover{ border-color:var(--mm-red); color:var(--mm-red); background:var(--mm-red-soft); }
.faq-cat-pill.active{ background:var(--mm-red); color:var(--mm-white); border-color:var(--mm-red); }

/* Badges */
.badge{display:inline-block; padding:4px 10px; border-radius:20px;
  font-size:12px; font-weight:700; vertical-align:middle; letter-spacing:.2px;}
.badge-blue{background:var(--mm-red-soft-2); color:var(--mm-red-dark)}
.badge-green{background:#DCFCE7; color:#166534}
.badge-red{background:var(--mm-red); color:var(--mm-white)}
.badge-purple{background:#EDE9FE; color:#5B21B6}
.badge-gray{background:var(--mm-gray-100); color:var(--mm-gray-700)}

/* Toast */
.toast{position:fixed; bottom:32px; right:32px;
  padding:16px 24px; border-radius:var(--radius-sm);
  background:var(--mm-black); color:var(--mm-white);
  font-size:14px; font-weight:600;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
  animation:slideIn .3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index:1000;}
@keyframes slideIn{from{transform:translateY(20px);opacity:0}}

/* ================= RESPONSIVE ================= */
.mobile-toggle{
  display:none; position:fixed; top:16px; left:16px; z-index:100;
  width:48px; height:48px; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; cursor:pointer; align-items:center; justify-content:center;
  box-shadow:var(--shadow); color:var(--mm-black);
}
.sidebar-overlay{display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.4); z-index:19; opacity:0; transition:opacity .3s ease; backdrop-filter:blur(2px);}
.sidebar-overlay.open{display:block; opacity:1}

@media (max-width: 900px) {
  .mobile-toggle{ display:flex; }
  .sidebar{
    position:fixed; top:0; left:0; bottom:0; height:100vh;
    transform:translateX(-100%); width:var(--sidebar-w) !important;
    box-shadow:var(--shadow-lg); z-index:20;
  }
  .sidebar.open{ transform:translateX(0); }
  .sidebar .logo-text, .sidebar .menu-item span, .sidebar-footer { opacity:1 !important; pointer-events:auto !important;}
  .sidebar .menu-item { justify-content:flex-start !important; padding:12px 16px !important; }
  
  .main{ padding:80px 20px 20px; }
  .dashboard-header h1{ font-size:26px; }
  .dash-grid{ grid-template-columns:1fr; }
  .card{ padding:24px 20px; }
  .btn{ width:100%; justify-content:center; margin:8px 0; }
}

@media (min-width: 901px) {
  .sidebar.collapsed .menu-item:hover::after {
    content: attr(data-title);
    position: absolute; left: 100%; top: 50%; transform: translateY(-50%);
    background: var(--mm-black); color: white; padding: 6px 12px;
    border-radius: 6px; font-size: 12px; white-space: nowrap; margin-left: 12px;
    pointer-events: none; z-index: 50;
  }
  .sidebar.collapsed .menu-item { position: relative; }
}
</style>
</head>

<body>

<button class="mobile-toggle" id="mobileToggle" aria-label="Abrir menú">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</button>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <a class="sidebar-header" href="#/">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
        <rect x="0" y="0" width="40" height="40" rx="8" fill="#E2001A"/>
        <path d="M8 30V12h4.2l3.3 9.2L18.8 12H23v18h-3.6v-11l-3 8.4h-2.8l-3-8.4v11H8z" fill="#FFFFFF"/>
        <circle cx="30" cy="11" r="2.4" fill="#FFFFFF"/>
      </svg>
      <div class="logo-text">
        <span class="brand-name">MediaMarkt</span>
        <span class="brand-sub">Operaciones</span>
      </div>
    </a>

    <nav>
      <a class="menu-item" href="#/" data-title="Inicio">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>

function parseFechaLocal(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatearFecha(date){
  return date.toLocaleDateString('es-ES',
    { day:'2-digit', month:'2-digit', year:'numeric' });
}
async function copiarTexto(texto){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(texto); return true;
    }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch{ return false; }
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;

}

function calcularGarantia(fechaStr){
  const fechaCompra = parseFechaLocal(fechaStr);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dias = Math.floor((hoy - fechaCompra) / 86400000);

  if(dias <= 60){
    return { estado:'devolucion', dias, restantes: 60 - dias };
  }
  const anios = fechaCompra >= new Date(2022, 0, 1) ? 3 : 2;
  const fin = new Date(fechaCompra);
  fin.setFullYear(fin.getFullYear() + anios);
  if(hoy > fin) return { estado:'fuera', anios, fechaFin: fin };
  return { estado:'vigente', anios, fechaFin: fin };
}

  productos: { label:'🛠️ Productos', desc:'Defectuosos, incompletos, dañados o que no funcionan.' },
  facturas: { label:'🧾 Facturas', desc:'Solicitud de facturas y gestión de garantías.' },
  devoluciones: { label:'🔄 Devoluciones', desc:'Plazos, gastos de devolución y estado del reembolso.' }
};

function renderOracle({ categoria, cola, estado, extras }){
  return `<div class="oracle"><h3>🖥️ Oracle</h3><p><strong>Categoría:</strong> ${esc(categoria)}</p><p><strong>Cola:</strong> ${esc(cola)}</p><p><strong>Estado:</strong> ${esc(estado)}</p>${extras ? extras.map(x => `<p><strong>${esc(x.k)}:</strong> ${esc(x.v)}</p>`).join('') : ''}</div>`;
}

function renderCampo(campo){
  const valor = state.datos[campo.id] ?? campo.default ?? '';
  const id = `campo-${campo.id}`;
  if(campo.tipo === 'select'){
    return `<label for="${id}">${esc(campo.label)}</label><select id="${id}" data-campo="${campo.id}">${campo.opciones.map(op => `<option value="${esc(op)}" ${op === valor ? 'selected' : ''}>${esc(op)}</option>`).join('')}</select>`;
  }
  if(campo.tipo === 'textarea'){
    return `<label for="${id}">${esc(campo.label)}</label><textarea id="${id}" data-campo="${campo.id}" placeholder="${esc(campo.placeholder || '')}">${esc(valor)}</textarea>`;
  }
  return `<label for="${id}">${esc(campo.label)}</label><input type="text" id="${id}" data-campo="${campo.id}" value="${esc(valor)}" placeholder="${esc(campo.placeholder || '')}">`;
}

function plantillaLayout({ breadcrumb, titulo, badge, info, oracle, campos, volverA }){
  return `
    <div class="card">
      <div class="breadcrumb">${breadcrumb}</div>
      <h2>${esc(titulo)} ${badge ? `<span class="badge ${badge.clase}">${esc(badge.texto)}</span>` : ''}</h2>
      ${info || ''}
      ${oracle ? renderOracle(oracle) : ''}
      ${campos.map(renderCampo).join('')}
      <h3>📧 Vista previa</h3>
      <textarea id="preview" readonly></textarea>
      <div style="margin-top:24px">
        <button class="btn btn-success" data-copiar>📋 Copiar plantilla</button>
        <a class="btn btn-ghost" href="${volverA}">⬅ Volver</a>
      </div>
    </div>
  `;
}

function resolveRoute(route){
  if(routes[route]) return routes[route];
  const mEstGrupo = route.match(/^estado-pedido\/(avanzar|cancelar|incidencia|tienda)$/);
  if(mEstGrupo) return () => viewEstadoPedidoLista(mEstGrupo[1]);
  const mEstFicha = route.match(/^estado-pedido\/ficha\/([\w-]+)(?:\?modo=([a-z]+))?$/);
  if(mEstFicha && getEstadoPorSlug(mEstFicha[1])) {
    const modo = mEstFicha[2] || 'avanzar';
    return () => viewEstadoPedidoFicha(mEstFicha[1], modo);
  }
  const mRec = route.match(/^reclamacion\/(paqueteria|gran-carga)\/([\w-]+)$/);
  if(mRec) return () => viewReclamacionForm(mRec[2], mRec[1]);
  const mFaq = route.match(/^marketplace\/faqs\/([\w-]+)$/);
  if(mFaq && categoriasFaqsMarketplace[mFaq[1]]) return () => viewMarketplaceFaqs(mFaq[1]);
  const mMkt = route.match(/^marketplace\/gestion\/([\w-]+)$/);
  if(mMkt && tiposMarketplace[mMkt[1]]) return () => viewMarketplaceForm(mMkt[1]);
  return null;
}

function currentRoute(){ return location.hash.replace(/^#\/?/, ''); }

function initSidebar(){
  const sidebar = document.getElementById('sidebar');
  const btnCollapse = document.getElementById('btnCollapse');
  const mobileToggle = document.getElementById('mobileToggle');
  const overlay = document.getElementById('sidebarOverlay');

  if(btnCollapse) {
    btnCollapse.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      const svg = btnCollapse.querySelector('svg');
      if(sidebar.classList.contains('collapsed')){
        svg.style.transform = 'rotate(180deg)';
      } else {
        svg.style.transform = 'rotate(0deg)';
      }
    });
  }

  if(mobileToggle && overlay) {
    mobileToggle.addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('open');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    });
    document.querySelectorAll('.sidebar nav .menu-item').forEach(el => {
      el.addEventListener('click', () => {
        if(window.innerWidth <= 900) {
          sidebar.classList.remove('open');
          overlay.classList.remove('open');
        }
      });
    });
  }
}

function render(){
  const route = currentRoute();
  const view = resolveRoute(route) || viewNotFound;
  document.getElementById('contenido').innerHTML = view();

  document.querySelectorAll('.sidebar .menu-item').forEach(el => {
    const target = el.getAttribute('href')?.replace(/^#\/?/, '') ?? '';
    const segmento = target.split('/')[0];
    const routeSeg = route.split('/')[0];
    el.classList.toggle('active', target !== '' && segmento === routeSeg);
  });

  updatePreview();
  gestionarReloj(route);
  startDashboardClock();
}

window.addEventListener('hashchange', render);

let dashClockInterval = null;
function startDashboardClock(){
  if(dashClockInterval) clearInterval(dashClockInterval);
  const timeEl = document.getElementById('relojHora');
  const dateEl = document.getElementById('relojFecha');
  if(!timeEl || !dateEl) return;

  const update = () => {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    timeEl.textContent = `${hh}:${mm}`;
    dateEl.textContent = now.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  };
  update();
  dashClockInterval = setInterval(update, 1000);
}

  if(route !== 'reclamacion/paqueteria' && route !== 'tipo/tv') return;

    const disponible = enHorario && !esFinDeSemana;

    el.className = `alert ${disponible ? 'alert-success' : 'alert-danger'}`;
    el.innerHTML = `<div style="font-size:22px;font-weight:700;margin-bottom:6px">${hh}:${mm}:${ss}</div><div>${disponible ? '🟢 Transferencia disponible' : '🔴 Fuera de horario de transferencia'}</div>`;
  };
  actualizar();
  clockInterval = setInterval(actualizar, 1000);
}

function updatePreview(){
  const route = currentRoute();
  const preview = document.getElementById('preview');
  if(!preview) return;

  if(previewRenderers[route]){ preview.value = previewRenderers[route](state, state.datos); return; }
  const mRec = route.match(/^reclamacion\/(paqueteria|gran-carga)\/([\w-]+)$/);
  if(mRec && tiposReclamacion[mRec[2]]){ preview.value = plantillaReclamacion(state, state.datos, mRec[2], mRec[1]); return; }
  const mMkt = route.match(/^marketplace\/gestion\/([\w-]+)$/);
  if(mMkt && tiposMarketplace[mMkt[1]]){ preview.value = plantillaMarketplace(state, state.datos, mMkt[1]); return; }
  
  if(route === 'gran-carga/tienda/visita'){ preview.value = plantillaGranCargaTiendaVisita(state, state.datos); return; }
  if(route === 'gran-carga/tienda/correo'){ preview.value = plantillaGranCargaCorreo(state, state.datos); return; }
  if(route === 'gran-carga/web/tienda'){ preview.value = plantillaGranCargaWebTienda(state, state.datos); return; }
  if(route === 'gran-carga/web/sat'){ preview.value = plantillaGranCargaWebSat(state, state.datos); return; }
  if(route === 'tipo/tv'){ preview.value = plantillaFrontOffice(state, state.datos); return; }
  if(route === 'fuera-garantia/seguro/square-trade'){ preview.value = plantillaSeguroSquareTrade(state, state.datos); return; }
  if(route === 'fuera-garantia/seguro/movil'){ preview.value = plantillaSeguroMovil(state, state.datos); return; }
  if(route === 'fuera-garantia/seguro/domestic'){ preview.value = plantillaSeguroDomestic(state, state.datos); return; }
  if(route === 'fuera-garantia/paqueteria/tienda'){ preview.value = plantillaFGTienda(state, state.datos); return; }
  if(route === 'fuera-garantia/paqueteria/hub'){ preview.value = plantillaFGHub(state, state.datos); return; }
  if(route === 'fuera-garantia/gran-carga/plantilla'){ preview.value = plantillaFGGranCarga(state, state.datos); return; }
  if(route === 'financiacion/gestiones/tienda'){ preview.value = plantillaFinanciacionGestionTienda(state, state.datos); return; }
  if(route === 'financiacion/gestiones/online'){ preview.value = plantillaFinanciacionGestionOnline(state, state.datos); return; }
}

function filtrarFaqs(query){
  const q = String(query || '').toLowerCase().trim();
  const items = document.querySelectorAll('#faqList .faq-item');
  let visibles = 0;
  items.forEach(el => {
    const txt = el.textContent.toLowerCase();
    const match = !q || txt.includes(q);
    el.style.display = match ? '' : 'none';
    if(match) visibles++;
  });
  const contador = document.getElementById('faqCount');
  if(contador) contador.textContent = visibles;
}

function buscarEstadoPedido(){
  const q = (document.getElementById('buscarEstado')?.value || '').toLowerCase().trim();
  const out = document.getElementById('resultadoBuscarEstado');
  if(!out) return;
  if(!q){ out.innerHTML = ''; return; }

  const matches = estadosPedido.filter(e => e.estado.toLowerCase().includes(q) || e.derivarA.toLowerCase().includes(q) || (e.cancelar || '').toLowerCase().includes(q));
  if(!matches.length){ out.innerHTML = '<div class="alert alert-warning">❌ No se encontraron estados con ese texto.</div>'; return; }

  out.innerHTML = matches.slice(0, 8).map(e => `
    <a class="estado-card" href="#/estado-pedido/ficha/${e.slug}?modo=avanzar" style="margin-bottom:8px">
      <div class="titulo"><span style="font-size:18px">${esc(e.icono)}</span><span>${esc(e.estado)}</span></div>
      <div class="meta">${esc(gruposEstadoPedido[e.grupo].label)} · ${esc(e.plazo)}</div>
    </a>
  `).join('');
}

function validarFecha(){
  const input = document.getElementById('fechaCompra');
  const aviso = document.getElementById('avisoFecha');
  if(!input.value){ aviso.textContent = '⚠️ Selecciona una fecha de compra para continuar.'; aviso.style.display = 'block'; input.focus(); return; }
  state.fechaCompra = input.value;
  state.garantia = calcularGarantia(input.value);
  switch(state.garantia.estado){
    case 'devolucion': location.hash = '#/devolucion'; break;
    case 'fuera':      location.hash = '#/fuera';      break;
    default:           location.hash = '#/validar-danio'; break;
  }
}

async function copiarPreview(){
  const preview = document.getElementById('preview');
  if(!preview) return;
  const ok = await copiarTexto(preview.value);
  toast(ok ? '✅ Copiado al portapapeles' : '❌ No se pudo copiar');
}

function nuevoCaso(){
  resetState();
  if(currentRoute() === 'fecha'){ render(); }
  else{ location.hash = '#/fecha'; }
}

function buscarSAT(){
  const texto = document.getElementById('marcaSAT')?.value.toLowerCase().trim();
  const resultado = document.getElementById('resultadoSAT');
  if(!resultado) return;
  if(!texto){ resultado.innerHTML = ''; return; }
  let html = '';
  Object.entries(satMarcas).forEach(([marca, datos]) => {
    if(marca.includes(texto)){
      html += `<div class="alert alert-info"><h3>${marca.toUpperCase()}</h3><p><strong>Teléfono:</strong> ${datos.telefono}</p><p><strong>Horario:</strong> ${datos.horario}</p></div>`;
    }
  });
  resultado.innerHTML = html || '<div class="alert alert-warning">❌ No se encontraron resultados</div>';
}

document.addEventListener('input', e => {
  if(e.target.matches('[data-faq-search]')){ filtrarFaqs(e.target.value); return; }
  if(e.target.matches('[data-buscar-estado]')){ buscarEstadoPedido(); return; }
  const stateEl = e.target.closest('[data-state]');
  if(stateEl){ state[stateEl.dataset.state] = stateEl.value; return; }
  const campoEl = e.target.closest('[data-campo]');
  if(campoEl){ state.datos[campoEl.dataset.campo] = campoEl.value; updatePreview(); }
});

document.addEventListener('change', e => {
  const campoEl = e.target.closest('[data-campo]');
  if(campoEl){ state.datos[campoEl.dataset.campo] = campoEl.value; updatePreview(); }
});

document.addEventListener('click', e => {
  if(e.target.closest('[data-validar-fecha]')){ validarFecha(); return; }
  if(e.target.closest('[data-copiar]'))       { copiarPreview(); return; }
  if(e.target.closest('[data-nuevo-caso]'))   { nuevoCaso(); return; }

  const filtro = e.target.closest('[data-filtro-plazo]');
  if(filtro){ e.preventDefault(); state.filtroPlazo = filtro.dataset.filtroPlazo; render(); return; }

  const link = e.target.closest('a[href^="#"]');
  if(!link) return;
  const href = link.getAttribute('href') || '#/';
  const currentHash = (location.hash.replace(/^#/, '') || '').replace(/^\/+/, '');
  const targetHash  = (href.replace(/^#/, '') || '').replace(/^\/+/, '');

  if(currentHash === targetHash && !link.dataset.filtroPlazo){
    e.preventDefault();
    render();
    document.querySelector('.main').scrollTo({ top:0, behavior:'smooth' });
  }
});

(function init(){
  initSidebar();
  const yearEl = document.getElementById('year');
  if(yearEl) yearEl.textContent = new Date().getFullYear();
  render();
})();
</script>
</body>
</html>
