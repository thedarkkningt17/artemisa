<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediaMarkt · Centro de Procesos Operativos</title>

<style>
:root{
  --mm-red:#E2001A; --mm-red-dark:#B8001A; --mm-red-darker:#8F0014;
  --mm-red-hover:#C40017; --mm-red-soft:#FEF2F2; --mm-red-soft-2:#FDE4E6;
  --mm-white:#FFFFFF; --mm-black:#1A1A1A;
  --mm-gray-900:#2B2B2B; --mm-gray-700:#4B5563; --mm-gray-500:#6B7280;
  --mm-gray-300:#D1D5DB; --mm-gray-100:#F3F4F6; --mm-gray-50:#F9FAFB;
  --mm-purple:#7C3AED;

  --mm-bg-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1920&q=80');
  --mm-bg-opacity: 0.22;

  --bg:var(--mm-gray-100); --surface:var(--mm-white); --surface-2:var(--mm-gray-50);
  --border:#E5E7EB; --text:var(--mm-black); --text-muted:var(--mm-gray-700);
  --primary:var(--mm-red); --primary-hover:var(--mm-red-hover);
  --success:#16A34A; --danger:#DC2626; --warning:#D97706;
  --info-bg:var(--mm-red-soft); --success-bg:#F0FDF4;
  --warning-bg:#FFF7ED; --danger-bg:#FEF2F2;

  --radius:12px; --radius-sm:8px;
  --shadow:0 1px 3px rgb(0 0 0/.08), 0 4px 12px rgb(0 0 0/.04);
  --space-1:.25rem; --space-2:.5rem; --space-3:1rem; --space-4:1.5rem;
  --sidebar-w: 280px;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text);
  height:100vh; overflow:hidden;
}

.layout{display:flex; flex-direction:column; height:100vh}

.sidebar{
  width:100%; flex-shrink:0;
  background:linear-gradient(135deg, var(--mm-red) 0%, var(--mm-red-dark) 100%);
  color:var(--mm-white);
  padding:16px 20px 10px;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
  position:relative; z-index:10;
}

.mm-logo{
  display:flex; align-items:center; gap:16px;
  background:var(--mm-white);
  border-radius:16px;
  padding:12px 26px 12px 16px;
  flex-shrink:0;
  box-shadow:0 10px 30px rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.4) inset;
  transition:transform .2s, box-shadow .2s;
}
.mm-logo:hover{
  transform:translateY(-2px);
  box-shadow:0 14px 36px rgba(0,0,0,.32), 0 1px 0 rgba(255,255,255,.4) inset;
}
.mm-logo svg{display:block; flex-shrink:0; width:52px; height:52px;}

.mm-logo-text{
  display:flex; flex-direction:column; gap:2px;
  line-height:1.05;
}
.brand-name{
  font-size:24px; font-weight:900;
  color:var(--mm-red);
  letter-spacing:-.3px; line-height:1;
}
.brand-sub{
  font-size:10.5px; font-weight:600;
  color:var(--mm-gray-700);
  letter-spacing:2px; text-transform:uppercase; line-height:1.2;
}
.brand-sub b{
  color:var(--mm-red);
  font-weight:800;
  letter-spacing:2.5px;
}

.sidebar nav{
  display:flex; flex-direction:row; gap:6px;
  flex-wrap:wrap; align-items:center; justify-content:center;
  width:100%; max-width:1100px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.18);
}

.menu-item{
  display:flex; align-items:center; gap:8px;
  width:auto; text-align:left; white-space:nowrap;
  background:rgba(255,255,255,.10); color:var(--mm-white);
  border:none; padding:9px 14px; border-radius:var(--radius-sm);
  cursor:pointer; font:inherit; font-size:13px; font-weight:500;
  text-decoration:none;
  transition:background .15s, transform .1s;
}
.menu-item:hover{background:rgba(255,255,255,.22); transform:translateY(-1px)}
.menu-item.active{
  background:var(--mm-white); color:var(--mm-red);
  font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.menu-item:focus-visible{outline:2px solid var(--mm-white); outline-offset:2px}

.menu-toggle{
  display:none; position:fixed; top:14px; left:14px; z-index:100;
  width:46px; height:46px;
  background:var(--mm-red); color:var(--mm-white);
  border:none; border-radius:10px; cursor:pointer;
  font-size:22px; align-items:center; justify-content:center;
  box-shadow:0 4px 14px rgba(226,0,26,.35);
  transition:transform .15s, background .15s;
}
.menu-toggle:hover{transform:scale(1.05);background:var(--mm-red-hover)}
.menu-toggle:focus-visible{outline:2px solid var(--mm-white); outline-offset:2px}

.sidebar-overlay{display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.5); z-index:9; opacity:0; transition:opacity .3s ease;}
.sidebar-overlay.open{display:block; opacity:1}

.main{
  flex:1; padding:var(--space-4); overflow-y:auto;
  position:relative; z-index:1;
}
.main::before{
  content:''; position:absolute; inset:0;
  background-image:var(--mm-bg-image);
  background-size:cover; background-position:center; background-repeat:no-repeat;
  opacity:var(--mm-bg-opacity); pointer-events:none; z-index:-1;
}
.main::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(180deg,
    rgba(255,255,255,.25) 0%,
    rgba(255,255,255,.45) 50%,
    rgba(255,255,255,.25) 100%);
  pointer-events:none; z-index:-1;
}
.main > *{position:relative; z-index:1}

.footer{
  flex-shrink:0;
  background:#000000;
  color:rgba(255,255,255,.85);
  text-align:center;
  padding:12px 20px;
  font-size:12.5px;
  letter-spacing:.4px;
  border-top:3px solid var(--mm-red);
  box-shadow:0 -2px 12px rgba(0,0,0,.25);
  position:relative;
  z-index:5;
}
.footer strong{
  color:var(--mm-white);
  font-weight:800;
  letter-spacing:1px;
}
.footer strong::before{
  content:'';
  display:inline-block;
  width:6px; height:6px;
  background:var(--mm-red);
  border-radius:50%;
  margin:0 8px 1px 4px;
  vertical-align:middle;
}
.footer .footer-sep{opacity:.4;margin:0 8px}
.footer .footer-year{opacity:.6}

.card{
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  padding:var(--space-4); border-radius:var(--radius);
  border:1px solid var(--border); border-top:4px solid var(--mm-red);
  box-shadow:0 4px 16px rgba(0,0,0,.10);
  margin-bottom:var(--space-4);
}
.card h2{margin-bottom:var(--space-3); font-size:20px; color:var(--mm-black)}
.card h3{margin:var(--space-3) 0 var(--space-2); font-size:16px; color:var(--mm-black)}
.breadcrumb{font-size:13px; color:var(--text-muted); margin-bottom:6px}
.breadcrumb a{color:inherit; text-decoration:none}
.breadcrumb a:hover{color:var(--mm-red)}

.home-grid, .fin-grid{display:grid; gap:16px; margin-top:20px;}
.home-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fin-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.home-card, .fin-card{
  display:flex; flex-direction:column; gap:8px;
  background:var(--mm-white); border:1px solid var(--border);
  border-radius:var(--radius); padding:20px;
  text-decoration:none; color:var(--text);
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  transition:transform .15s, box-shadow .15s, border-color .15s;
  position:relative; overflow:hidden;
}
.fin-card{padding:22px; gap:10px}
.home-card::before, .fin-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:4px;
  background:var(--mm-red); transform:scaleX(0); transform-origin:left;
  transition:transform .25s ease;
}
.home-card:hover, .fin-card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 24px rgba(0,0,0,.12);
  border-color:var(--mm-red);
}
.home-card:hover::before, .fin-card:hover::before{transform:scaleX(1)}
.home-card:focus-visible, .fin-card:focus-visible{
  outline:2px solid var(--mm-red); outline-offset:2px;
}
.home-card-icon, .fin-card-icon{font-size:32px; line-height:1; margin-bottom:4px}
.fin-card-icon{font-size:34px}
.home-card-title, .fin-card-title{font-size:16px; font-weight:700; color:var(--mm-black);}
.fin-card-title{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.fin-card-title .badge{font-size:10px; padding:3px 8px; font-weight:700}
.home-card-desc, .fin-card-desc{font-size:13px; color:var(--text-muted); line-height:1.45;}
.fin-card-desc{line-height:1.5}
.home-card-arrow, .fin-card-arrow{
  margin-top:auto; align-self:flex-end;
  color:var(--mm-red); font-size:18px; font-weight:700;
  transition:transform .15s;
}
.home-card:hover .home-card-arrow,
.fin-card:hover .fin-card-arrow{transform:translateX(4px)}

.info-table{width:100%; border-collapse:collapse; margin:12px 0; font-size:14px;
  background:var(--mm-white); border-radius:var(--radius-sm);
  overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.05);}
.info-table th{background:var(--mm-red); color:var(--mm-white); text-align:left;
  padding:12px 14px; font-weight:700; font-size:13px;
  text-transform:uppercase; letter-spacing:.3px;}
.info-table td{padding:11px 14px; border-bottom:1px solid var(--border);
  color:var(--text-muted); vertical-align:top;}
.info-table tr:last-child td{border-bottom:none}
.info-table tr:nth-child(even) td{background:var(--mm-gray-50)}
.info-table strong{color:var(--mm-black)}

.steps-list{list-style:none; counter-reset:step; margin:14px 0; padding:0;}
.steps-list li{position:relative; padding:12px 14px 12px 52px;
  background:var(--mm-white); border:1px solid var(--border);
  border-left:4px solid var(--mm-red); border-radius:var(--radius-sm);
  margin-bottom:8px; font-size:14px; color:var(--text-muted); line-height:1.5;}
.steps-list li::before{
  counter-increment:step; content:counter(step);
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:26px; height:26px;
  background:var(--mm-red); color:var(--mm-white);
  border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-weight:700; font-size:13px;
}
.steps-list li strong{color:var(--mm-black)}

.check-list{list-style:none; margin:10px 0; padding:0}
.check-list li{position:relative; padding:8px 10px 8px 32px;
  font-size:14px; color:var(--text-muted); line-height:1.55;}
.check-list li::before{content:'✓'; position:absolute; left:6px; top:8px;
  color:var(--mm-red); font-weight:700; font-size:15px;}

.faq-item{border:1px solid var(--border); border-radius:var(--radius-sm);
  margin-bottom:10px; overflow:hidden; background:var(--mm-white);}
.faq-item summary{padding:14px 16px; cursor:pointer; font-weight:600;
  font-size:14px; color:var(--mm-black);
  background:var(--mm-gray-50); list-style:none;
  position:relative; padding-right:44px;
  transition:background .15s;}
.faq-item summary::-webkit-details-marker{display:none}
.faq-item summary::after{content:'+'; position:absolute; right:16px; top:50%;
  transform:translateY(-50%); color:var(--mm-red);
  font-size:20px; font-weight:700; transition:transform .2s;}
.faq-item[open] summary::after{content:'−'}
.faq-item summary:hover{background:var(--mm-red-soft)}
.faq-item p{padding:14px 16px; font-size:14px; color:var(--text-muted);
  line-height:1.6; border-top:1px solid var(--border);}
.faq-answer{padding:14px 16px; font-size:14px; color:var(--text-muted);
  line-height:1.6; border-top:1px solid var(--border);}
.faq-answer p + p{margin-top:8px}
.faq-answer strong{color:var(--mm-black)}

/* ===== Buscador y filtros de FAQs ===== */
.faq-search-wrap{
  position:relative;
  margin:var(--space-3) 0;
}
.faq-search-wrap input{
  padding-left:42px;
  font-size:15px;
  background:var(--mm-white);
}
.faq-search-wrap::before{
  content:'🔍';
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:16px;
  pointer-events:none;
  opacity:.55;
}
.faq-cats{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:var(--space-3) 0;
}
.faq-cat-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 14px;
  border-radius:20px;
  background:var(--mm-gray-50);
  color:var(--text-muted);
  border:1px solid var(--border);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  transition:all .15s;
}
.faq-cat-pill:hover{
  border-color:var(--mm-red);
  color:var(--mm-red);
  background:var(--mm-red-soft);
}
.faq-cat-pill.active{
  background:var(--mm-red);
  color:var(--mm-white);
  border-color:var(--mm-red);
  box-shadow:0 3px 10px rgba(226,0,26,.25);
}
.faq-cat-pill .count{
  font-size:11px;
  opacity:.75;
  font-weight:700;
}
.faq-counter{
  font-size:13px;
  color:var(--text-muted);
  margin:var(--space-2) 0;
}
.faq-counter b{color:var(--mm-red);font-weight:700}

.market-highlights{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin:var(--space-3) 0;
}
.highlight{
  background:var(--mm-white);
  border:1px solid var(--border);
  border-left:4px solid var(--mm-red);
  border-radius:var(--radius-sm);
  padding:14px 16px;
}
.highlight-label{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.6px;
  color:var(--text-muted);
  margin-bottom:4px;
}
.highlight-value{
  font-size:18px;
  font-weight:800;
  color:var(--mm-black);
}
.highlight-value small{font-size:12px;font-weight:600;color:var(--text-muted)}

.btn{display:inline-flex; align-items:center; gap:8px;
  padding:10px 18px; border:none; border-radius:var(--radius-sm);
  cursor:pointer; font:inherit; font-size:14px; font-weight:600;
  text-decoration:none; margin:4px 4px 4px 0;
  transition:transform .1s, background .15s, box-shadow .15s;}
.btn:hover{transform:translateY(-1px); box-shadow:0 4px 10px rgba(0,0,0,.08)}
.btn:focus-visible{outline:2px solid var(--mm-red); outline-offset:2px}
.btn-primary{background:var(--mm-red); color:var(--mm-white)}
.btn-primary:hover{background:var(--mm-red-hover)}
.btn-success{background:var(--success); color:var(--mm-white)}
.btn-danger{background:var(--danger); color:var(--mm-white)}
.btn-purple{background:var(--mm-purple); color:var(--mm-white)}
.btn-secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
.btn-ghost{background:transparent; color:var(--text-muted); border:1px solid var(--border);}
.btn-ghost:hover{color:var(--mm-red); border-color:var(--mm-red)}

label{display:block; font-size:13px; font-weight:600;
  color:var(--text-muted); margin:var(--space-3) 0 4px;}
input,select,textarea{width:100%; padding:10px 12px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--surface); color:var(--text); font:inherit; font-size:14px;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--mm-red);
  box-shadow:0 0 0 3px rgba(226,0,26,.15);}
textarea{resize:vertical; min-height:180px; line-height:1.5}
textarea[readonly]{background:var(--surface-2)}

.alert{padding:12px 16px; border-radius:var(--radius-sm);
  border-left:4px solid; margin:var(--space-3) 0; font-size:14px; line-height:1.5;}
.alert h3{margin-top:0; font-size:15px}
.alert p + p{margin-top:6px}
.alert ul{margin-left:20px; margin-top:8px}
.alert-info{background:var(--info-bg); border-color:var(--mm-red)}
.alert-warning{background:var(--warning-bg); border-color:var(--warning)}
.alert-success{background:var(--success-bg); border-color:var(--success)}
.alert-danger{background:var(--danger-bg); border-color:var(--danger)}

.oracle{background:var(--mm-red-soft); border-left:4px solid var(--mm-red);
  padding:12px 16px; border-radius:var(--radius-sm);
  margin:var(--space-3) 0; font-size:14px;}
.oracle p{margin:4px 0}
.oracle h3{margin-top:0; color:var(--mm-red-dark)}

.badge{display:inline-block; padding:4px 10px; border-radius:20px;
  font-size:12px; font-weight:700; vertical-align:middle; letter-spacing:.2px;}
.badge-blue{background:var(--mm-red-soft-2); color:var(--mm-red-dark)}
.badge-green{background:#DCFCE7; color:#166534}
.badge-red{background:var(--mm-red); color:var(--mm-white)}
.badge-purple{background:#EDE9FE; color:#5B21B6}

.toast{position:fixed; top:20px; right:20px;
  padding:12px 20px; border-radius:var(--radius-sm);
  background:var(--mm-red); color:var(--mm-white);
  font-size:14px; font-weight:600;
  box-shadow:0 10px 25px rgba(226,0,26,.35);
  animation:slideIn .2s ease; z-index:1000;}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}}

.grid-motivos{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:10px; margin-top:var(--space-3);}
.grid-motivos .btn{width:100%; justify-content:flex-start; margin:0;
  text-align:left; padding:14px 16px;}
.grid-motivos .btn-secondary:hover{background:var(--mm-red-soft);
  border-color:var(--mm-red); color:var(--mm-red-dark);}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:var(--mm-red); border-radius:10px}
::-webkit-scrollbar-track{background:var(--mm-gray-100)}

@media (max-width:1024px){
  .sidebar{padding:14px 16px 8px; gap:12px}
  .mm-logo{padding:10px 22px 10px 14px; gap:14px}
  .mm-logo svg{width:44px; height:44px}
  .brand-name{font-size:21px}
  .brand-sub{font-size:10px; letter-spacing:1.6px}
  .menu-item{padding:8px 12px; font-size:12px}
  .main{padding:var(--space-3)}
  .card{padding:var(--space-3)}
  .info-table{font-size:13px}
  .info-table th, .info-table td{padding:9px 11px}
}

@media (max-width:768px){
  :root{ --sidebar-w: 280px; }
  .menu-toggle{display:flex}

  .sidebar{
    position:fixed; top:0; left:0; bottom:0;
    width:var(--sidebar-w); height:100vh;
    flex-direction:column; align-items:center;
    justify-content:flex-start;
    padding:20px 16px;
    transform:translateX(-100%);
    overflow-y:auto; z-index:11;
    gap:16px;
    box-shadow:none;
  }
  .sidebar.open{transform:translateX(0); box-shadow:4px 0 24px rgba(0,0,0,.25);}

  .mm-logo{
    padding:10px 18px 10px 12px;
    gap:12px;
    width:100%;
    justify-content:flex-start;
  }
  .mm-logo svg{width:40px; height:40px}
  .brand-name{font-size:19px}
  .brand-sub{font-size:9px; letter-spacing:1.3px}
  .brand-sub b{letter-spacing:1.6px}

  .sidebar nav{
    flex-direction:column; flex-wrap:nowrap;
    justify-content:flex-start; gap:6px;
    width:100%;
    padding-top:14px;
    max-width:none;
  }
  .menu-item{
    width:100%; justify-content:flex-start;
    font-size:14px; padding:12px 14px; white-space:normal;
  }
  .menu-item:hover{transform:none}

  .main{padding:72px 14px 20px}
  .card{padding:16px; margin-bottom:14px}
  .card h2{font-size:18px}
  .home-grid, .fin-grid, .grid-motivos{grid-template-columns:1fr; gap:12px;}
  .home-card, .fin-card{padding:16px}
  .btn{width:100%; justify-content:center; margin:6px 0}
  .btn-ghost, .btn-secondary, .btn-primary,
  .btn-success, .btn-purple{width:100%}
  textarea{min-height:140px}
  .toast{left:14px; right:14px; top:auto; bottom:20px; text-align:center;}
  .info-table{display:block; overflow-x:auto; white-space:nowrap}
  .steps-list li{padding:10px 12px 10px 46px; font-size:13px}
  .steps-list li::before{left:10px; width:24px; height:24px; font-size:12px}
  .faq-item summary{font-size:13px; padding:12px 40px 12px 14px}
  .faq-item p, .faq-answer{font-size:13px; padding:12px 14px}

  .footer{padding:10px 14px; font-size:11.5px;}
}

@media (max-width:480px){
  .main{padding:66px 10px 16px}
  .mm-logo{padding:8px 14px 8px 10px; gap:10px}
  .mm-logo svg{width:36px; height:36px}
  .brand-name{font-size:17px}
  .brand-sub{font-size:8.5px; letter-spacing:1.1px}
  .menu-item{font-size:13px; padding:11px 12px}
  .card{padding:14px; border-radius:10px}
  .card h2{font-size:16px}
  .card h3{font-size:14px}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseFechaLocal(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatearFecha(date){
  return date.toLocaleDateString('es-ES',
    { day:'2-digit', month:'2-digit', year:'numeric' });
}
async function copiarTexto(texto){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(texto); return true;
    }
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }catch{ return false; }
}
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

function calcularGarantia(fechaStr){
  const fechaCompra = parseFechaLocal(fechaStr);
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const dias = Math.floor((hoy - fechaCompra) / 86400000);

  if(dias <= 60){
    return { estado:'devolucion', dias, restantes: 60 - dias };
  }
  const anios = fechaCompra >= new Date(2022, 0, 1) ? 3 : 2;
  const fin = new Date(fechaCompra);
  fin.setFullYear(fin.getFullYear() + anios);
  if(hoy > fin) return { estado:'fuera', anios, fechaFin: fin };
  return { estado:'vigente', anios, fechaFin: fin };
}

${lineas || '__________'}

function renderOracle({ categoria, cola, estado, extras }){
  return `
    <div class="oracle">
      <h3>🖥️ Oracle</h3>
      <p><strong>Categoría:</strong> ${esc(categoria)}</p>
      <p><strong>Cola:</strong> ${esc(cola)}</p>
      <p><strong>Estado:</strong> ${esc(estado)}</p>
      ${extras ? extras.map(x => `<p><strong>${esc(x.k)}:</strong> ${esc(x.v)}</p>`).join('') : ''}
    </div>
  `;
}

function renderCampo(campo){
  const valor = state.datos[campo.id] ?? campo.default ?? '';
  const id = `campo-${campo.id}`;
  if(campo.tipo === 'select'){
    return `
      <label for="${id}">${esc(campo.label)}</label>
      <select id="${id}" data-campo="${campo.id}">
        ${campo.opciones.map(op => `
          <option value="${esc(op)}" ${op === valor ? 'selected' : ''}>${esc(op)}</option>
        `).join('')}
      </select>
    `;
  }
  if(campo.tipo === 'textarea'){
    return `
      <label for="${id}">${esc(campo.label)}</label>
      <textarea id="${id}" data-campo="${campo.id}"
                placeholder="${esc(campo.placeholder || '')}">${esc(valor)}</textarea>
    `;
  }
  return `
    <label for="${id}">${esc(campo.label)}</label>
    <input type="text" id="${id}" data-campo="${campo.id}"
           value="${esc(valor)}" placeholder="${esc(campo.placeholder || '')}">
  `;
}

function plantillaLayout({ breadcrumb, titulo, badge, info, oracle, campos, volverA }){
  return `
    <div class="card">
      <div class="breadcrumb">${breadcrumb}</div>
      <h2>
        ${esc(titulo)}
        ${badge ? `<span class="badge ${badge.clase}">${esc(badge.texto)}</span>` : ''}
      </h2>
      ${info || ''}
      ${oracle ? renderOracle(oracle) : ''}
      ${campos.map(renderCampo).join('')}

      <h3>📧 Vista previa</h3>
      <textarea id="preview" readonly></textarea>

      <div style="margin-top:16px">
        <button class="btn btn-success" data-copiar>📋 Copiar plantilla</button>
        <a class="btn btn-ghost" href="${volverA}">⬅ Volver</a>
      </div>
    </div>
  `;
}

function resolveRoute(route){
  if(routes[route]) return routes[route];

  const mRec = route.match(/^reclamacion\/(paqueteria|gran-carga)\/([\w-]+)$/);
  if(mRec) return () => viewReclamacionForm(mRec[2], mRec[1]);

  const mFaq = route.match(/^marketplace\/faqs\/([\w-]+)$/);
  if(mFaq && categoriasFaqsMarketplace[mFaq[1]]) return () => viewMarketplaceFaqs(mFaq[1]);

  const mMkt = route.match(/^marketplace\/gestion\/([\w-]+)$/);
  if(mMkt && tiposMarketplace[mMkt[1]]) return () => viewMarketplaceForm(mMkt[1]);

  return null;
}

function currentRoute(){
  return location.hash.replace(/^#\/?/, '');
}

function cerrarSidebarMovil(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if(sidebar) sidebar.classList.remove('open');
  if(overlay) overlay.classList.remove('open');
}
function toggleSidebarMovil(){
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  if(!sidebar || !overlay) return;
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}
function initSidebarMovil(){
  const toggle = document.getElementById('menuToggle');
  const overlay = document.getElementById('sidebarOverlay');
  if(toggle) toggle.addEventListener('click', toggleSidebarMovil);
  if(overlay) overlay.addEventListener('click', cerrarSidebarMovil);

  document.querySelectorAll('.sidebar .menu-item').forEach(el => {
    el.addEventListener('click', () => {
      if(window.innerWidth <= 768) cerrarSidebarMovil();
    });
  });
  window.addEventListener('resize', () => {
    if(window.innerWidth > 768) cerrarSidebarMovil();
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') cerrarSidebarMovil();
  });
}

function render(){
  const route = currentRoute();
  const view = resolveRoute(route) || viewNotFound;
  document.getElementById('contenido').innerHTML = view();

  document.querySelectorAll('.sidebar .menu-item').forEach(el => {
    const target = el.getAttribute('href')?.replace(/^#\/?/, '') ?? '';
    const segmento = target.split('/')[0];
    const routeSeg = route.split('/')[0];
    el.classList.toggle('active', target !== '' && segmento === routeSeg);
  });

  updatePreview();
  gestionarReloj(route);
}
window.addEventListener('hashchange', render);

let clockInterval = null;
function gestionarReloj(route){
  if(clockInterval){ clearInterval(clockInterval); clockInterval = null; }
  if(route !== 'reclamacion/paqueteria' && route !== 'tipo/tv') return;

  const el = document.getElementById('horaEspana');
  if(!el) return;

  const actualizar = () => {
    const ahora = new Date();
    const madrid = new Date(ahora.toLocaleString('en-US', { timeZone:'Europe/Madrid' }));
    const hh = String(madrid.getHours()).padStart(2,'0');
    const mm = String(madrid.getMinutes()).padStart(2,'0');
    const ss = String(madrid.getSeconds()).padStart(2,'0');

    const dia = madrid.getDay();
    const esFinDeSemana = dia === 0 || dia === 6;
    const enHorario = madrid.getHours() >= 9 && madrid.getHours() < 18;
    const disponible = enHorario && !esFinDeSemana;

    el.className = `alert ${disponible ? 'alert-success' : 'alert-danger'}`;
    el.innerHTML = `
      <div style="font-size:22px;font-weight:700;margin-bottom:6px">${hh}:${mm}:${ss}</div>
      <div>${disponible ? '🟢 Transferencia disponible' : '🔴 Fuera de horario de transferencia'}</div>
    `;
  };
  actualizar();
  clockInterval = setInterval(actualizar, 1000);
}

function filtrarFaqs(query){
  const q = String(query || '').toLowerCase().trim();
  const items = document.querySelectorAll('#faqList .faq-item');
  let visibles = 0;

  items.forEach(el => {
    const txt = el.textContent.toLowerCase();
    const match = !q || txt.includes(q);
    el.style.display = match ? '' : 'none';
    if(match) visibles++;
  });

  const contador = document.getElementById('faqCount');
  if(contador) contador.textContent = visibles;
}

function validarFecha(){
  const input = document.getElementById('fechaCompra');
  const aviso = document.getElementById('avisoFecha');
  if(!input.value){
    aviso.textContent = '⚠️ Selecciona una fecha de compra para continuar.';
    aviso.style.display = 'block';
    input.focus(); return;
  }
  state.fechaCompra = input.value;
  state.garantia = calcularGarantia(input.value);

  switch(state.garantia.estado){
    case 'devolucion': location.hash = '#/devolucion'; break;
    case 'fuera':      location.hash = '#/fuera';      break;
    default:           location.hash = '#/validar-danio'; break;
  }
}

}

    }
  });

}

function normalizeHash(h){
  h = (h || '').replace(/^#/, '');
  if(h === '' || h === '/') return '';
  return h.replace(/^\/+/, '');
}

document.addEventListener('input', e => {

  if(e.target.matches('[data-faq-search]')){
    filtrarFaqs(e.target.value);
    return;
  }

  const stateEl = e.target.closest('[data-state]');
  if(stateEl){ state[stateEl.dataset.state] = stateEl.value; return; }

  const campoEl = e.target.closest('[data-campo]');
  if(campoEl){
    state.datos[campoEl.dataset.campo] = campoEl.value;
    updatePreview();
  }
});

document.addEventListener('change', e => {
  const campoEl = e.target.closest('[data-campo]');
  if(campoEl){
    state.datos[campoEl.dataset.campo] = campoEl.value;
    updatePreview();
  }
});

document.addEventListener('click', e => {

  if(e.target.closest('[data-validar-fecha]')){ validarFecha(); return; }
  if(e.target.closest('[data-copiar]'))       { copiarPreview(); return; }
  if(e.target.closest('[data-nuevo-caso]'))   { nuevoCaso(); return; }

  const link = e.target.closest('a[href^="#"]');
  if(!link) return;

  const href = link.getAttribute('href') || '#/';
  const currentHash = normalizeHash(location.hash);
  const targetHash  = normalizeHash(href);

  if(currentHash === targetHash){
    e.preventDefault();
    render();

    const main = document.querySelector('.main');
    if(main) main.scrollTo({ top:0, behavior:'smooth' });
  }

});

(function init(){
  initSidebarMovil();

  const yearEl = document.getElementById('year');
  if(yearEl) yearEl.textContent = new Date().getFullYear();

  render();
})();
</script>
